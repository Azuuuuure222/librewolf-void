name: build

on:
  push:
    branches:
      - master
    tags:
      - '*'
    paths:
      - srcpkgs/librewolf/**
      - .github/workflows/main.yml

concurrency:
  group: librewolf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.LIBREWOLF_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 340
    cache-mode: write
    env:
      XBPS_TARGET_ARCH: x86_64-musl
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: free space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force

      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: checkout void-packages
        uses: actions/checkout@v7
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: overlay LibreWolf package into void-packages
        run: |
          set -euo pipefail
          rm -rf void-packages/srcpkgs/librewolf
          cp -a srcpkgs/librewolf void-packages/srcpkgs/librewolf

      - name: prepare package metadata
        id: meta
        run: |
          set -euo pipefail
          template="srcpkgs/librewolf/template"
          pkgname=$(sed -n 's/^pkgname=//p' "$template")
          version=$(sed -n 's/^version=//p' "$template")
          _rev=$(sed -n 's/^_rev=//p' "$template")
          checksum=$(sed -n 's/^checksum=//p' "$template")
          distfiles=$(sed -n 's/^distfiles="//p' "$template" | sed 's/"$//')
          : "${pkgname:?}" "${version:?}" "${_rev:?}" "${checksum:?}" "${distfiles:?}"

          printf '%s\n' "$checksum" | grep -Eq '^[0-9A-Fa-f]{64}$' || {
            echo "template checksum must be exactly one 64-character SHA-256 digest" >&2
            exit 1
          }

          set -- $distfiles
          [ "$#" -eq 1 ] || {
            echo "template must contain exactly one distfile URL" >&2
            exit 1
          }

          distfile="${pkgname}-${version}-${_rev}.source.tar.gz"
          release_tag="${version}-${_rev}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "$release_tag" ] || {
              echo "tag ${GITHUB_REF_NAME} does not match package version $release_tag" >&2
              exit 1
            }
          fi

          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"
          echo "distfile=$distfile" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rev=$_rev" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: sync release tag
        if: ${{ github.ref_type == 'branch' && github.ref_name == 'master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --force origin "HEAD:refs/tags/$TAG"

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REV: ${{ steps.meta.outputs.rev }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --title "librewolf $TAG" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${VERSION}-${REV}" \
            --latest=false

      - name: prepare xbps-static
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output xbps-static-latest.x86_64-musl.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm -f xbps-static-latest.x86_64-musl.tar.xz

      - name: install PGO Wayland compositor
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston

      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: bootstrap xbps-src
        timeout-minutes: 15
        working-directory: void-packages
        run: |
          set -euo pipefail
          apparmor_userns_restrict="$(sudo sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$apparmor_userns_restrict" >/dev/null || true' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export PATH="/opt/xbps/usr/bin/:$PATH"
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap

      - name: restore LibreWolf source
        id: source-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/sources/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v3-${{ steps.meta.outputs.sha256 }}

      - name: fetch and verify LibreWolf source
        timeout-minutes: 20
        working-directory: void-packages
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          mkdir -p hostdir/sources
          ./xbps-src -A "$XBPS_TARGET_ARCH" fetch librewolf

      - name: save LibreWolf source
        if: ${{ steps.source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/sources/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v3-${{ steps.meta.outputs.sha256 }}

      - name: build package
        timeout-minutes: 330
        working-directory: void-packages
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          ./xbps-src -A "$XBPS_TARGET_ARCH" pkg -j"$(nproc)" librewolf

      - name: checksum packages
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -euo pipefail
          sha256sum -- *.xbps
          sha512sum -- *.xbps

      - name: upload release assets
        working-directory: void-packages/hostdir/binpkgs/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.release_tag }}" *.xbps *-repodata --clobber

      - name: mark release latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.meta.outputs.release_tag }}" --latest
