name: build

on:
  push:
    branches:
      - master
    paths:
      - srcpkgs/librewolf/**
      - .github/workflows/main.yml
      - .github/scripts/**
  workflow_dispatch:

concurrency:
  group: librewolf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.LIBREWOLF_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 340
    env:
      XBPS_TARGET_ARCH: x86_64-musl
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_VERSION: "librewolf-x86_64-musl-skylake-v1"
      LIBREWOLF_PGO_CACHE_VERSION: "v1"
    steps:
      - name: free space
        run: |
          set -euo pipefail
          available_kib=$(df --output=avail -k / | tail -1 | tr -d " ")
          if [ "$available_kib" -lt $((90 * 1024 * 1024)) ]; then
            echo "Less than 90 GiB available; reclaiming runner disk space..."
            sudo rm -rf -- \
              /usr/share/dotnet \
              /usr/share/swift \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/.ghcup \
              /usr/local/share/boost \
              /usr/local/graalvm \
              /usr/local/share/powershell \
              /usr/local/share/chromium \
              /usr/local/lib/node_modules
            if command -v docker >/dev/null 2>&1; then
              sudo docker image prune --all --force
            fi
          else
            echo "Skipping runner cleanup; sufficient free space is already available."
          fi
          df -h /

      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: checkout void-packages
        uses: actions/checkout@v7
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: overlay LibreWolf package into void-packages
        run: |
          set -euo pipefail
          rm -rf void-packages/srcpkgs/librewolf
          cp -a srcpkgs/librewolf void-packages/srcpkgs/librewolf

      - name: validate and prepare package metadata
        id: meta
        run: |
          set -euo pipefail
          bash .github/scripts/validate-template.sh srcpkgs/librewolf/template

      - name: compute PGO cache key
        id: pgo-key
        run: |
          set -euo pipefail
          recipe_hash="$(
            {
              sha256sum srcpkgs/librewolf/template
              find srcpkgs/librewolf/patches -type f -print0 | sort -z | xargs -0 sha256sum
            } | sha256sum | cut -d' ' -f1
          )"
          echo "key=librewolf-pgo-${LIBREWOLF_PGO_CACHE_VERSION}-${{ steps.meta.outputs.sha256 }}-$recipe_hash" >> "$GITHUB_OUTPUT"

      - name: restore LibreWolf PGO profile
        id: pgo-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/pgo-cache
          key: ${{ steps.pgo-key.outputs.key }}

      - name: prepare xbps-static
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output xbps-static-latest.x86_64-musl.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm -f xbps-static-latest.x86_64-musl.tar.xz

      - name: install PGO Wayland compositor
        if: ${{ steps.pgo-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          if ! command -v weston >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends weston
          fi

      - name: allow xbps user namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: restore Void binary package cache
        id: xbps-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          key: void-repocache-v1-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: bootstrap xbps-src
        timeout-minutes: 15
        working-directory: void-packages
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap

      - name: save Void binary package cache
        if: ${{ steps.xbps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          key: void-repocache-v1-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: prepare sccache environment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const cacheUrl = process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!cacheUrl || !runtimeToken) {
              throw new Error("GitHub Actions cache runtime credentials are unavailable");
            }

            core.setSecret(runtimeToken);

            const quote = (value) => "'" + value.replaceAll("'", "'\"'\"'") + "'";
            const envFile = path.join(
              process.env.GITHUB_WORKSPACE,
              "void-packages",
              "hostdir",
              "sccache-env",
            );

            fs.writeFileSync(
              envFile,
              [
                `export SCCACHE_GHA_ENABLED=${quote(process.env.SCCACHE_GHA_ENABLED)}`,
                `export SCCACHE_GHA_VERSION=${quote(process.env.SCCACHE_GHA_VERSION)}`,
                `export ACTIONS_RESULTS_URL=${quote(cacheUrl)}`,
                `export ACTIONS_RUNTIME_TOKEN=${quote(runtimeToken)}`,
                "export SCCACHE_MULTILEVEL_CHAIN=disk,gha",
                "export SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY=ignore",
              ].join("\n") + "\n",
              { mode: 0o600 },
            );
            fs.chmodSync(envFile, 0o600);
            core.info(`prepared ${envFile}`);

      - name: restore LibreWolf source
        id: source-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v4-${{ steps.meta.outputs.sha256 }}

      - name: fetch and verify LibreWolf source
        timeout-minutes: 20
        working-directory: void-packages
        env:
          DISTFILE: ${{ steps.meta.outputs.distfile }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          srcdir="hostdir/sources/librewolf-${VERSION}"
          distfile="${srcdir}/${DISTFILE}"
          mkdir -p "$srcdir"

          if [ "${{ steps.source-cache.outputs.cache-hit }}" = "true" ]; then
            echo "LibreWolf source cache hit; verifying cached archive..."
            printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check --status -
          else
            echo "LibreWolf source cache miss; fetching through xbps-src..."
            ./xbps-src -A "$XBPS_TARGET_ARCH" fetch librewolf
            test -s "$distfile"
            printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check --status -
          fi

      - name: save LibreWolf source
        if: ${{ steps.source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v4-${{ steps.meta.outputs.sha256 }}

      - name: build package
        timeout-minutes: 330
        working-directory: void-packages
        env:
          PGO_CACHE_HIT: ${{ steps.pgo-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"

          if [ "$PGO_CACHE_HIT" != "true" ]; then
            pgo_runtime_dir="$PWD/hostdir/pgo-runtime"
            rm -rf "$pgo_runtime_dir"
            mkdir -p "$pgo_runtime_dir"
            chmod 700 "$pgo_runtime_dir"

            weston_pid=""
            cleanup_weston() {
              if [ -n "$weston_pid" ]; then
                kill "$weston_pid" >/dev/null 2>&1 || true
                wait "$weston_pid" >/dev/null 2>&1 || true
              fi
              rm -rf "$pgo_runtime_dir"
            }
            trap cleanup_weston EXIT

            XDG_RUNTIME_DIR="$pgo_runtime_dir" \
              weston --backend=headless-backend.so --socket=wayland-1 \
              --idle-time=0 --width=1920 --height=1080 \
              >"$pgo_runtime_dir/weston.log" 2>&1 &
            weston_pid=$!

            for _ in $(seq 1 100); do
              [ -S "$pgo_runtime_dir/wayland-1" ] && break
              sleep 0.1
            done
            test -S "$pgo_runtime_dir/wayland-1"
            : >"$pgo_runtime_dir/wayland-required"
          fi

          ./xbps-src -A "$XBPS_TARGET_ARCH" pkg -j"$(nproc)" librewolf

      - name: save LibreWolf PGO profile
        if: ${{ steps.pgo-cache.outputs.cache-hit != 'true' && hashFiles('void-packages/hostdir/pgo-cache/merged.profdata', 'void-packages/hostdir/pgo-cache/jarlog') != '' }}
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/pgo-cache
          key: ${{ steps.pgo-key.outputs.key }}

      - name: remove sccache credentials
        if: ${{ always() }}
        working-directory: void-packages
        run: rm -f hostdir/sccache-env

      - name: checksum packages
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -euo pipefail
          compgen -G '*.xbps' >/dev/null || {
            echo "no XBPS packages were produced" >&2
            exit 1
          }
          compgen -G '*-repodata' >/dev/null || {
            echo "no repository metadata was produced" >&2
            exit 1
          }
          sha256sum -- *.xbps *-repodata
          sha512sum -- *.xbps *-repodata

      - name: publish release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --force origin "HEAD:refs/tags/$TAG"

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REV: ${{ steps.meta.outputs.rev }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --title "librewolf $TAG" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${VERSION}-${REV}" \
            --latest=false

      - name: upload release assets
        working-directory: void-packages/hostdir/binpkgs/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.release_tag }}" *.xbps *-repodata --clobber

      - name: mark release latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.meta.outputs.release_tag }}" --latest
