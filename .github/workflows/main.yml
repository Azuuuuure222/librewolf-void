name: build

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout librewolf-void
        uses: actions/checkout@v7
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version=//p' srcpkgs/librewolf/template)
          _rev=$(sed -n 's/^_rev=//p' srcpkgs/librewolf/template)
          : "${version:?}" "${_rev:?}"
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --title "librewolf $TAG" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${version}-${_rev}" \
            --latest=false
  build:
    needs: release
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { host: x86_64-musl, target: x86_64-musl }
    runs-on: ubuntu-22.04
    steps:
      - name: free space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/hostedtoolcache/
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force
      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: librewolf
      - name: checkout void-packages
        uses: actions/checkout@v7
        with:
          repository: void-linux/void-packages
          # Pin Void packaging inputs so dependency/toolchain changes cannot silently alter a build.
          ref: fd9fcd5940f7b6757b87bf6b1c7a970c337d0a08
          path: void-packages
      - name: copy librewolf into srcpkgs
        run: cp -rv librewolf/srcpkgs/librewolf void-packages/srcpkgs
      - name: prepare xbps-static
        run: |
          mkdir -p /opt/xbps
          curl -LO https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar xvf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm xbps-static-latest.x86_64-musl.tar.xz
      - name: build
        env:
          XBPS_TARGET_ARCH: x86_64-musl
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          cd void-packages
          jobs="$(nproc)"
          test "$jobs" -ge 1
          ./xbps-src -A x86_64-musl binary-bootstrap
          ./xbps-src pkg -j"${jobs}" -A x86_64-musl librewolf
      - name: sign
        env:
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
          XBPS_TARGET_ARCH: ${{ matrix.target }}
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
          SIGNEDBY: ${{ vars.SIGNEDBY }}
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          keyfile="$RUNNER_TEMP/xbps-privkey.pem"
          trap 'rm -f "$keyfile"' EXIT
          umask 077
          test -n "$PRIV_KEY" || { echo "PRIV_KEY is not configured" >&2; exit 1; }
          test -n "$XBPS_PASSPHRASE" || { echo "SIGN_PASS is not configured" >&2; exit 1; }
          test -n "$SIGNEDBY" || { echo "SIGNEDBY is not configured" >&2; exit 1; }
          printf '%s\n' "$PRIV_KEY" > "$keyfile"
          test -s "$keyfile"
          openssl rsa -in "$keyfile" -check -noout -passin env:XBPS_PASSPHRASE
          xbps-rindex -r "$PWD"
          xbps-rindex -s --signedby "$SIGNEDBY" --privkey "$keyfile" "$PWD"
          xbps-rindex -S --privkey "$keyfile" *.xbps
          xbps-rindex -c "$PWD"
      - name: checksum
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          sha256sum $(echo *.xbps)
          sha512sum $(echo *.xbps)
      - name: upload assets
        working-directory: void-packages/hostdir/binpkgs/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" *.xbps *.xbps.sig2 *-repodata --clobber
  latest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: mark release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --latest
