name: build

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' srcpkgs/librewolf/template)
          _rev=$(sed -n 's/^_rev=//p' srcpkgs/librewolf/template)
          checksum=$(sed -n 's/^checksum=//p' srcpkgs/librewolf/template)
          distfiles=$(sed -n 's/^distfiles="//p' srcpkgs/librewolf/template | sed 's/"$//')
          : "${version:?}" "${_rev:?}" "${checksum:?}" "${distfiles:?}"
          printf '%s\n' "$checksum" | grep -Eq '^[0-9A-Fa-f]{64}$' || {
            echo "template checksum must be exactly one 64-character SHA-256 digest" >&2
            exit 1
          }
          set -- $distfiles
          [ "$#" -eq 1 ] || {
            echo "template must contain exactly one distfile URL" >&2
            exit 1
          }
          case "$1" in
            https://*) ;;
            *) echo "distfile URL must use HTTPS" >&2; exit 1 ;;
          esac
          expected_tag="${version}-${_rev}"
          test "$TAG" = "$expected_tag" || {
            echo "Tag $TAG does not match package version $expected_tag" >&2
            exit 1
          }
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --title "librewolf $TAG" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${version}-${_rev}" \
            --latest=false

  build:
    needs: release
    runs-on: ${{ vars.LIBREWOLF_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
    cache-mode: write
    env:
      XBPS_TARGET_ARCH: x86_64-musl
    steps:
      - name: free space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/hostedtoolcache/
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force

      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: librewolf
          persist-credentials: false

      - name: checkout void-packages
        uses: actions/checkout@v7
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: copy librewolf into srcpkgs
        run: cp -r librewolf/srcpkgs/librewolf void-packages/srcpkgs

      - name: prepare LibreWolf source cache key
        id: source-meta
        run: |
          set -euo pipefail
          template="librewolf/srcpkgs/librewolf/template"
          pkgname=$(sed -n 's/^pkgname=//p' "$template")
          checksum=$(sed -n 's/^checksum=//p' "$template")
          version=$(sed -n 's/^version=//p' "$template")
          _rev=$(sed -n 's/^_rev=//p' "$template")
          distfiles=$(sed -n 's/^distfiles="//p' "$template" | sed 's/"$//')
          : "${pkgname:?}" "${checksum:?}" "${version:?}" "${_rev:?}" "${distfiles:?}"
          printf '%s\n' "$checksum" | grep -Eq '^[0-9A-Fa-f]{64}$' || {
            echo "invalid or missing SHA-256 checksum" >&2
            exit 1
          }
          set -- $distfiles
          [ "$#" -eq 1 ] || {
            echo "template must contain exactly one distfile URL" >&2
            exit 1
          }
          disturl=$(printf '%s\n' "$1" | sed -e "s/\\\${pkgname}/$pkgname/g" -e "s/\\\${version}/$version/g" -e "s/\\\${_rev}/$_rev/g")
          case "$disturl" in
            https://*) ;;
            *) echo "distfile URL must use HTTPS" >&2; exit 1 ;;
          esac
          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"
          echo "disturl=$disturl" >> "$GITHUB_OUTPUT"
          echo "distfile=${pkgname}-${version}-${_rev}.source.tar.gz" >> "$GITHUB_OUTPUT"

      - name: restore LibreWolf source cache
        id: source-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/librewolf-source-cache
          key: librewolf-source-v2-${{ steps.source-meta.outputs.sha256 }}

      - name: fetch and verify LibreWolf source
        env:
          SOURCE_URL: ${{ steps.source-meta.outputs.disturl }}
          SOURCE_FILE: ${{ steps.source-meta.outputs.distfile }}
          SOURCE_SHA256: ${{ steps.source-meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/librewolf-source-cache"
          cache_file="$cache_dir/$SOURCE_FILE"
          dest="void-packages/hostdir/sources/$SOURCE_FILE"
          tmp="$cache_file.part"
          mkdir -p "$cache_dir" "$(dirname "$dest")"

          verify() {
            printf '%s  %s\n' "$SOURCE_SHA256" "$1" | sha256sum -c - >/dev/null
          }

          if [ -s "$cache_file" ] && verify "$cache_file"; then
            echo "LibreWolf source: verified cache hit"
          else
            rm -f "$cache_file" "$tmp"
            curl --fail --location --http1.1 \
              --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --speed-limit 1024 --speed-time 60 \
              --max-time 900 --continue-at - --output "$tmp" "$SOURCE_URL"
            test -s "$tmp"
            verify "$tmp"
            mv -f "$tmp" "$cache_file"
          fi

          install -m 0644 "$cache_file" "$dest"
          verify "$dest"

      - name: save LibreWolf source cache
        if: ${{ steps.source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/librewolf-source-cache
          key: librewolf-source-v2-${{ steps.source-meta.outputs.sha256 }}

      - name: enforce LibreWolf source SHA-256
        run: |
          set -euo pipefail
          source="void-packages/hostdir/sources/${{ steps.source-meta.outputs.distfile }}"
          test -s "$source"
          printf '%s  %s\n' "${{ steps.source-meta.outputs.sha256 }}" "$source" | sha256sum -c -

      - name: prepare xbps-static
        run: |
          mkdir -p /opt/xbps
          curl -LO https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar xvf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm xbps-static-latest.x86_64-musl.tar.xz

      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # xbps-uunshare needs uid_map access for its build chroot.
          apparmor_userns_restrict="$(sudo sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$apparmor_userns_restrict" >/dev/null || true' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export PATH="/opt/xbps/usr/bin/:$PATH"
          cd void-packages
          jobs="$(nproc)"
          test "$jobs" -ge 1
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap
          ./xbps-src pkg -j"${jobs}" -A "$XBPS_TARGET_ARCH" librewolf

      - name: checksum
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          sha256sum -- *.xbps
          sha512sum -- *.xbps

      - name: upload assets
        working-directory: void-packages/hostdir/binpkgs/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" *.xbps *-repodata --clobber

  latest:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: mark release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --latest
