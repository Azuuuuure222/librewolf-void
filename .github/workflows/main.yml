name: build

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout librewolf-void
        uses: actions/checkout@v7
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version=//p' srcpkgs/librewolf/template)
          _rev=$(sed -n 's/^_rev=//p' srcpkgs/librewolf/template)
          : "${version:?}" "${_rev:?}"
          expected_tag="${version}-${_rev}"
          test "$TAG" = "$expected_tag" || {
            echo "Tag $TAG does not match package version $expected_tag" >&2
            exit 1
          }
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --title "librewolf $TAG" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${version}-${_rev}" \
            --latest=false
  build:
    needs: release
    runs-on: ${{ vars.LIBREWOLF_RUNNER || 'ubuntu-24.04' }}
    env:
      XBPS_TARGET_ARCH: x86_64-musl
    steps:
      - name: free space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/hostedtoolcache/
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force
      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: librewolf
      - name: checkout void-packages
        uses: actions/checkout@v7
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
      - name: copy librewolf into srcpkgs
        run: cp -rv librewolf/srcpkgs/librewolf void-packages/srcpkgs
      - name: prepare xbps-static
        run: |
          mkdir -p /opt/xbps
          curl -LO https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar xvf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm xbps-static-latest.x86_64-musl.tar.xz
      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: fetch librewolf source
        run: |
          set -euo pipefail
          pkg_template="librewolf/srcpkgs/librewolf/template"
          pkgname="$(sed -n 's/^pkgname=//p' "$pkg_template")"
          version="$(sed -n 's/^version=//p' "$pkg_template")"
          _rev="$(sed -n 's/^_rev=//p' "$pkg_template")"
          distfiles="$(sed -n 's/^distfiles="//p' "$pkg_template" | sed 's/"$//')"
          checksum="$(sed -n 's/^checksum=//p' "$pkg_template")"
          distfile="${pkgname}-${version}-${_rev}.source.tar.gz"
          disturl="${distfiles//\$\{pkgname\}/$pkgname}"
          disturl="${disturl//\$\{version\}/$version}"
          disturl="${disturl//\$\{_rev\}/$_rev}"
          dest="void-packages/hostdir/sources/$distfile"
          tmp="$dest.part"
          mkdir -p "$(dirname "$dest")"
          curl --fail --location --http1.1 \
            --retry 8 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 3600 \
            --continue-at - --output "$tmp" "$disturl"
          test -s "$tmp"
          printf '%s  %s\n' "$checksum" "$tmp" | sha256sum -c -
          mv -f "$tmp" "$dest"
          test -s "$dest"
      - name: build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # xbps-uunshare needs uid_map access for its build chroot.
          apparmor_userns_restrict="$(sudo sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$apparmor_userns_restrict" >/dev/null || true' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export PATH="/opt/xbps/usr/bin/:$PATH"
          cd void-packages
          jobs="$(nproc)"
          test "$jobs" -ge 1
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap
          ./xbps-src pkg -j"${jobs}" -A "$XBPS_TARGET_ARCH" librewolf
      - name: checksum
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          sha256sum $(echo *.xbps)
          sha512sum $(echo *.xbps)
      - name: upload assets
        working-directory: void-packages/hostdir/binpkgs/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" *.xbps *-repodata --clobber
  latest:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: mark release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --latest
