name: build

on:
  push:
    branches:
      - master
    paths:
      - srcpkgs/librewolf/**
      - .github/workflows/main.yml

concurrency:
  group: librewolf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.LIBREWOLF_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 340
    env:
      XBPS_TARGET_ARCH: x86_64-musl
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: free space
        run: |
          set -euo pipefail
          sudo rm -rf -- \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/local/graalvm \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo docker image prune --all --force
          df -h /

      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: checkout void-packages
        uses: actions/checkout@v7
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: overlay LibreWolf package into void-packages
        run: |
          set -euo pipefail
          rm -rf void-packages/srcpkgs/librewolf
          cp -a srcpkgs/librewolf void-packages/srcpkgs/librewolf

      - name: prepare package metadata
        id: meta
        run: |
          set -euo pipefail
          template="srcpkgs/librewolf/template"
          pkgname=$(sed -n 's/^pkgname=//p' "$template")
          version=$(sed -n 's/^version=//p' "$template")
          _rev=$(sed -n 's/^_rev=//p' "$template")
          revision=$(sed -n 's/^revision=//p' "$template")
          checksum=$(sed -n 's/^checksum=//p' "$template" | tr -d '\r')
          distfiles=$(sed -n 's/^distfiles="//p' "$template" | sed 's/"$//')
          : "${pkgname:?}" "${version:?}" "${_rev:?}" "${revision:?}" "${checksum:?}" "${distfiles:?}"

          printf '%s\n' "$checksum" | grep -Eq '^[0-9A-Fa-f]{64}$' || {
            echo "template checksum must be exactly one 64-character SHA-256 digest" >&2
            exit 1
          }

          printf '%s\n' "$revision" | grep -Eq '^[0-9]+$' || {
            echo "template revision must be a non-negative integer" >&2
            exit 1
          }

          set -- $distfiles
          [ "$#" -eq 1 ] || {
            echo "template must contain exactly one distfile URL" >&2
            exit 1
          }

          distfile="${pkgname}-${version}-${_rev}.source.tar.gz"
          distfile_from_url="${distfiles##*/}"
          [ "$distfile_from_url" = "$distfile" ] || {
            echo "distfile URL basename does not match package metadata" >&2
            echo "expected: $distfile" >&2
            echo "actual:   $distfile_from_url" >&2
            exit 1
          }
          release_tag="${version}-${_rev}-${revision}"


          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"
          echo "distfile=$distfile" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rev=$_rev" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: prepare xbps-static
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output xbps-static-latest.x86_64-musl.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm -f xbps-static-latest.x86_64-musl.tar.xz

      - name: install PGO Wayland compositor
        run: |
          set -euo pipefail
          if ! command -v weston >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends weston
          fi

      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: allow xbps user namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: bootstrap xbps-src
        timeout-minutes: 15
        working-directory: void-packages
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap

      - name: provision CI sccache in xbps masterdir
        working-directory: void-packages
        run: |
          set -euo pipefail
          test -x "$SCCACHE_PATH"
          install -Dm755 "$SCCACHE_PATH" masterdir/usr/libexec/sccache-real
          cat > masterdir/usr/bin/sccache <<'EOF'
#!/bin/sh
set -eu
if [ -r /host/sccache-env ]; then
  . /host/sccache-env
fi
exec /usr/libexec/sccache-real "$@"
EOF
          chmod 0755 masterdir/usr/bin/sccache

          umask 077
          {
            printf 'SCCACHE_GHA_ENABLED=on\n'
            printf 'SCCACHE_IDLE_TIMEOUT=0\n'
            printf 'SCCACHE_SERVER_UDS=/host/sccache.sock\n'
            printf 'ACTIONS_RESULTS_URL=%s\n' "$ACTIONS_RESULTS_URL"
            printf 'ACTIONS_RUNTIME_TOKEN=%s\n' "$ACTIONS_RUNTIME_TOKEN"
          } > hostdir/sccache-env

          masterdir/usr/bin/sccache --version
          masterdir/usr/bin/sccache --version

      - name: restore LibreWolf source
        id: source-cache
        uses: actions/cache/restore@v6
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v4-${{ steps.meta.outputs.sha256 }}

      - name: fetch and verify LibreWolf source
        timeout-minutes: 20
        working-directory: void-packages
        env:
          DISTFILE: ${{ steps.meta.outputs.distfile }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          srcdir="hostdir/sources/librewolf-${VERSION}"
          distfile="${srcdir}/${DISTFILE}"
          mkdir -p "$srcdir"

          if [ "${{ steps.source-cache.outputs.cache-hit }}" = "true" ]; then
            echo "LibreWolf source cache hit; verifying cached archive..."
            printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check --status -
          else
            echo "LibreWolf source cache miss; fetching through xbps-src..."
            ./xbps-src -A "$XBPS_TARGET_ARCH" fetch librewolf
            test -s "$distfile"
            printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check --status -
          fi

      - name: save LibreWolf source
        if: ${{ steps.source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v4-${{ steps.meta.outputs.sha256 }}

      - name: build package
        timeout-minutes: 330
        working-directory: void-packages
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          ./xbps-src -A "$XBPS_TARGET_ARCH" pkg -j"$(nproc)" librewolf

      - name: remove sccache credentials
        if: ${{ always() }}
        working-directory: void-packages
        run: |
          set -euo pipefail
          SCCACHE_SERVER_UDS="$PWD/hostdir/sccache.sock" "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
          rm -f hostdir/sccache-env hostdir/sccache.sock

      - name: checksum packages
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -euo pipefail
          sha256sum -- *.xbps *-repodata
          sha512sum -- *.xbps *-repodata

      - name: publish release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --force origin "HEAD:refs/tags/$TAG"

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REV: ${{ steps.meta.outputs.rev }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --title "librewolf $TAG" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${VERSION}-${REV}" \
            --latest=false

      - name: upload release assets
        working-directory: void-packages/hostdir/binpkgs/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.release_tag }}" *.xbps *-repodata --clobber

      - name: mark release latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.meta.outputs.release_tag }}" --latest
