name: source-cache

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    cache-mode: write
    steps:
      - name: checkout librewolf-void
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: prepare source
        id: source
        run: |
          set -euo pipefail
          template=srcpkgs/librewolf/template
          pkgname=$(sed -n 's/^pkgname=//p' "$template")
          version=$(sed -n 's/^version=//p' "$template")
          _rev=$(sed -n 's/^_rev=//p' "$template")
          checksum=$(sed -n 's/^checksum=//p' "$template")
          distfiles=$(sed -n 's/^distfiles="//p' "$template" | sed 's/"$//')
          : "${pkgname:?}" "${version:?}" "${_rev:?}" "${checksum:?}" "${distfiles:?}"
          printf '%s\n' "$checksum" | grep -Eq '^[0-9A-Fa-f]{64}$' || {
            echo "invalid or missing SHA-256 checksum" >&2
            exit 1
          }
          set -- $distfiles
          [ "$#" -eq 1 ] || {
            echo "template must contain exactly one distfile URL" >&2
            exit 1
          }
          disturl=${distfiles//\$\{pkgname\}/$pkgname}
          disturl=${disturl//\$\{version\}/$version}
          disturl=${disturl//\$\{_rev\}/$_rev}
          case "$disturl" in
            https://*) ;;
            *) echo "distfile URL must use HTTPS" >&2; exit 1 ;;
          esac
          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"
          echo "url=$disturl" >> "$GITHUB_OUTPUT"
          echo "file=librewolf-${version}-${_rev}.source.tar.gz" >> "$GITHUB_OUTPUT"

      - name: cache LibreWolf source
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/librewolf-source-cache
          key: librewolf-source-v2-${{ steps.source.outputs.sha256 }}

      - name: fetch and verify on cache miss
        env:
          SOURCE_URL: ${{ steps.source.outputs.url }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          cache_file="$RUNNER_TEMP/librewolf-source-cache/$SOURCE_FILE"
          tmp="$cache_file.part"
          mkdir -p "$(dirname "$cache_file")"

          verify() {
            printf '%s  %s\n' "$SOURCE_SHA256" "$1" | sha256sum -c - >/dev/null
          }

          if [ -s "$cache_file" ] && verify "$cache_file"; then
            echo "LibreWolf source: verified cache hit"
            exit 0
          fi

          rm -f "$cache_file" "$tmp"
          curl --fail --location --http1.1 \
            --retry 8 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 3600 \
            --continue-at - --output "$tmp" "$SOURCE_URL"
          test -s "$tmp"
          verify "$tmp"
          mv -f "$tmp" "$cache_file"
